<!-- ③ 改這裡：data-slug 要和這個檔案的檔名相同（不含 .html），也要和 posts.js 裡的 slug 相同 -->
<body data-root="../../" data-page="blog" data-slug="your-post-slug">

<header class="article-head">

    <div class="crumbs"><a href="../index.html">文章</a> ／ <span id="a-cat"></span></div>
    <!-- ④ 改這裡：標題與副標 -->
    <h1>文章標題</h1>
    <p class="dek">一句話副標，說明讀者會得到什麼。</p>
    <div class="byline">
      <img src="../../assets/img/coach.jpg" alt="楊博智">
      <div><strong>楊博智 Po Chih Yang</strong><span id="a-date"></span></div>
    </div>
  </div>
</header>

<main class="article-wrap">
  <article class="article-body">
    <!-- ⑤ 從這裡開始寫內文。可用的格式：
         <p>段落</p>
         <h2 id="s1">大標題</h2>   <h3>小標題</h3>
         <ul><li>項目</li></ul>    <ol><li>步驟</li></ol>
         <strong>粗體</strong>     <a href="網址">連結</a>
         <blockquote>引言</blockquote>
         <div class="callout"><b>重點：</b>一段想強調的內容</div>
         <figure><img src="../../assets/img/圖片檔名.jpg" alt="描述"><figcaption>圖說</figcaption></figure>
    -->
    <p>開頭段落：用一個選手常問的問題或場景帶入。</p>

    <h2 id="s1">第一個重點</h2>
    <p>內文……</p>

    <h2 id="s2">第二個重點</h2>
    <p>內文……</p>

    <h2 id="s3">結論：你可以怎麼做</h2>
    <p>內文……</p>
  </article>

  <!-- 文末行動呼籲（可以不改） -->
  <aside class="article-cta">
    <h3>想要一份照你生活安排的課表？</h3>
    <p>一對一線上教練會依你的工作時間、目標賽事與恢復狀況調整每週課表；如果想先自己練，也可以從現成的訓練課表開始。</p>
    <div class="row">
      <a class="btn" href="https://docs.google.com/forms/d/1OIfbL7VuoSGEuI7I7qRtSjhvsJowcaMKTRpmMSym7cA/edit?usp=drive_web&ouid=100801459121245555120" target="_blank" rel="noopener">預約免費諮詢</a>
      <a class="btn btn-ghost" href="../../plans/index.html">看訓練課表</a>
    </div>
  </aside>
</main>

<section class="related" data-hide-if-empty style="border-bottom:none;">
  <div class="wrap">
    <h2>延伸閱讀</h2>
    <div class="teaser-grid" id="related-list"></div>
  </div>
