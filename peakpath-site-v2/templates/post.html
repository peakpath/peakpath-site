<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{title}}｜PeakPath Coaching 峰行訓練</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{url}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{url}}">
<meta property="og:image" content="{{image}}">
<meta property="og:type" content="article">
<link rel="icon" type="image/png" href="../../assets/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body data-root="../../" data-page="blog" data-slug="{{slug}}">

<header class="article-head">
  <div class="article-wrap">
    <div class="crumbs"><a href="../index.html">文章</a> ／ <span id="a-cat"></span></div>
    <h1>{{title}}</h1>
    {{dek}}
    <div class="byline">
      <img src="../../assets/img/coach.jpg" alt="楊博智">
      <div><strong>楊博智 Po Chih Yang</strong><span id="a-date"></span></div>
    </div>
  </div>
</header>

<main class="article-wrap">
  <article class="article-body">
{{toc}}
{{body}}
  </article>

  <aside class="article-cta">
    <h3>想要一份照你生活安排的課表？</h3>
    <p>一對一線上教練會依你的工作時間、目標賽事與恢復狀況調整每週課表；如果想先自己練，也可以從現成的訓練課表開始。</p>
    <div class="row">
      <a class="btn" data-link="form" href="../../index.html#contact">預約免費諮詢</a>
      <a class="btn btn-ghost" href="../../plans/index.html">看訓練課表</a>
    </div>
  </aside>
</main>

<section class="related" data-hide-if-empty style="border-bottom:none;">
  <div class="wrap">
    <h2>延伸閱讀</h2>
    <div class="teaser-grid" id="related-list"></div>
  </div>
</section>

<script src="../../assets/posts.js"></script>
<script src="../../assets/settings.js"></script>
<script src="../../assets/site.js"></script>
</body>
</html>
